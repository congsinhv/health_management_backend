# Load test configuration presets
light_load:
  concurrent_users: 5
  requests_per_user: 10
  duration: 300  # 5min
  ramp_up: 30    # 30s ramp-up

medium_load:
  concurrent_users: 15
  requests_per_user: 10
  duration: 600  # 10min
  ramp_up: 60

heavy_load:
  concurrent_users: 30
  requests_per_user: 5
  duration: 600  # 10min
  ramp_up: 120

stress_test:
  concurrent_users: 50
  requests_per_user: 10
  duration: 1800  # 30min
  ramp_up: 300

soak_test:
  concurrent_users: 10
  requests_per_user: continuous
  duration: 172800  # 48h
  ramp_up: 300