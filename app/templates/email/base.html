<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}VHealth{% endblock %}</title>
    <link rel="icon" type="image/png" href="https://storage.googleapis.com/vhealth-test-public/favicon.png" />
    <style>
      /* Reset and base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        line-height: 1.6;
        color: #1a1a1a;
        background-color: #f8f9fa;
        margin: 0;
        padding: 0;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      /* Container */
      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      /* Header */
      .header {
        background: linear-gradient(135deg, #00bba7 0%, #00bc7d 100%);
        padding: 32px 40px;
        text-align: center;
      }

      .logo-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      .logo-image {
        width: 40px;
        height: 40px;
        display: block;
      }

      .logo {
        font-size: 28px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.025em;
        margin: 0;
      }

      .tagline {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.025em;
        text-transform: uppercase;
      }

      /* Content */
      .content {
        padding: 40px;
      }

      .content h1 {
        font-size: 24px;
        font-weight: 700;
        color: #101828;
        margin-bottom: 24px;
        letter-spacing: -0.025em;
        line-height: 1.3;
      }

      .greeting {
        font-size: 16px;
        color: #374151;
        margin-bottom: 20px;
        font-weight: 500;
      }

      .content p {
        font-size: 16px;
        color: #6a7282;
        margin-bottom: 20px;
        line-height: 1.7;
      }

      /* Button */
      .button-container {
        text-align: center;
        margin: 32px 0;
      }

      .button {
        display: inline-block;
        padding: 16px 32px;
        background: linear-gradient(135deg, #00bba7 0%, #00bc7d 100%);
        color: #ffffff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.025em;
        transition: all 0.2s ease;
        box-shadow: 0 4px 6px -1px rgba(0, 187, 167, 0.3);
      }

      .button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 8px -1px rgba(0, 187, 167, 0.4);
      }

      /* Unified info box styles */
      .info-box {
        background-color: #f8f9fa;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 16px;
        margin: 20px 0;
      }

      .info-box p {
        font-size: 14px;
        color: #374151;
        margin: 0;
        line-height: 1.6;
      }

      .info-box p + p {
        margin-top: 8px;
      }

      .info-box strong {
        color: #101828;
        font-weight: 600;
      }

      .info-box a {
        color: #00bba7;
        word-break: break-all;
        text-decoration: none;
      }

      .info-box a:hover {
        text-decoration: underline;
      }

      /* Link fallback - uses base info-box style */
      .link-fallback {
        background-color: #f8f9fa;
        border-color: #e5e7eb;
      }

      /* Warning box - uses base info-box style */
      .warning {
        background-color: #f8f9fa;
        border-color: #e5e7eb;
      }

      /* Security notice - uses base info-box style */
      .security-notice {
        background-color: #f8f9fa;
        border-color: #e5e7eb;
      }

      /* Footer */
      .footer {
        background-color: #f8f9fa;
        padding: 32px 40px;
        border-top: 1px solid #e5e7eb;
        text-align: center;
      }

      .footer p {
        font-size: 12px;
        color: #657282;
        margin: 0;
        line-height: 1.5;
      }

      .footer a {
        color: #00bba7;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      /* Responsive design */
      @media only screen and (max-width: 600px) {
        .email-container {
          margin: 0;
          border-radius: 0;
        }

        .header,
        .content,
        .footer {
          padding: 24px 20px;
        }

        .logo-container {
          flex-direction: column;
          gap: 8px;
        }

        .logo-image {
          width: 32px;
          height: 32px;
        }

        .logo {
          font-size: 24px;
        }

        .content h1 {
          font-size: 20px;
        }

        .button {
          padding: 14px 24px;
          font-size: 15px;
        }
      }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #111827;
        }

        .email-container {
          background-color: #1f2937;
        }

        .content h1 {
          color: #f9fafb;
        }

        .greeting {
          color: #d1d5db;
        }

        .content p {
          color: #9ca3af;
        }

        .footer {
          background-color: #111827;
          border-top-color: #374151;
        }

        .footer p {
          color: #9ca3af;
        }
      }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <div style="padding: 20px 0">
      <div class="email-container">
        <!-- Header -->
        <div class="header">
          <div class="logo-container">
            <img src="https://storage.googleapis.com/vhealth-test-public/favicon.png" alt="VHealth Logo" class="logo-image" style="display:block; width:40px; height:40px;" width="40" height="40" />
            <div class="logo">VHealth</div>
          </div>
          <div class="tagline">Quản lý sức khỏe thông minh</div>
        </div>

        <!-- Content -->
        <div class="content">
          {% block content %}{% endblock %}
        </div>

        <!-- Footer -->
        <div class="footer">
          <p>
            {% block footer_text %}Đây là email tự động từ VHealth.<br />Vui lòng không trả lời email này.{% endblock %}
          </p>
          <p style="margin-top: 16px; font-size: 11px; color: #95a1af">
            VHealth | © 2025 Bản quyền thuộc về VHealth
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
