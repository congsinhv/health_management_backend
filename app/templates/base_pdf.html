<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả dự đoán béo phì</title>
    <style>
        @font-face {
            font-family: 'Noto Sans';
            src: url('{{ font_path }}');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans', Arial, sans-serif;
            font-size: 12pt;
            line-height: 1.6;
            color: #333;
        }

        .page {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            page-break-after: always;
        }

        .page:last-child {
            page-break-after: auto;
        }

        h1 {
            font-size: 24pt;
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18pt;
            color: #34495e;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        h3 {
            font-size: 14pt;
            color: #7f8c8d;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .info-item {
            padding: 10px;
            background: #ecf0f1;
            border-radius: 5px;
        }

        .info-label {
            font-weight: bold;
            color: #2c3e50;
        }

        .info-value {
            color: #34495e;
            margin-top: 5px;
        }

        .metric-box {
            background: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin: 15px 0;
        }

        .metric-value {
            font-size: 28pt;
            font-weight: bold;
            color: #3498db;
        }

        .metric-label {
            font-size: 12pt;
            color: #7f8c8d;
        }

        .status-box {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
        }

        .status-normal {
            background: #d5f4e6;
            border: 2px solid #27ae60;
            color: #27ae60;
        }

        .status-warning {
            background: #ffeaa7;
            border: 2px solid #fdcb6e;
            color: #e17055;
        }

        .status-danger {
            background: #fab1a0;
            border: 2px solid #e74c3c;
            color: #c0392b;
        }

        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #bdc3c7;
            font-size: 10pt;
            color: #95a5a6;
            text-align: center;
        }

        ul {
            margin: 10px 0;
            padding-left: 25px;
        }

        li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
