services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: health_management_db
    environment:
      POSTGRES_DB: health_management
      POSTGRES_USER: health_user
      POSTGRES_PASSWORD: health_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_user -d health_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - health_network

  # FastAPI Application
  api:
    build: .
    container_name: health_management_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - health_network
    restart: unless-stopped

  # Development tools (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: health_management_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@health.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - health_network
    profiles:
      - dev

volumes:
  postgres_data:

networks:
  health_network:
    driver: bridge
